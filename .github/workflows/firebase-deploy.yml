name: Deploy Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@15.37.0 deploy --only firestore:rules --non-interactive
