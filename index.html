<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10B981">
  <meta name="application-name" content="Daily Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Tracker">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

  <title>Daily Income &amp; Expense Tracker</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #171c30;
      color: #eef1fa;
      font: 16px/1.5 system-ui, sans-serif;
    }

    input, button, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #8bbaff; outline-offset: 2px; }

    #gate {
      width: min(100%, 540px);
      margin: 0 auto;
      padding-bottom: 24px;
    }

    .auth-banner {
      text-align: center;
      background: linear-gradient(115deg, #0e898b, #326dd6);
      padding: 22px 14px;
      border-radius: 0 0 24px 24px;
    }

    .auth-banner h1 {
      margin: 0;
      color: white;
      font-size: clamp(20px, 5vw, 26px);
      line-height: 1.25;
    }

    .auth-card {
      margin: 14px 12px;
      padding: 16px 14px 26px;
      background: #222943;
      border-radius: 18px;
    }

    .auth-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .auth-title h2 {
      font-size: 19px;
      line-height: 1.25;
      margin: 0;
    }

    #language {
      color: #d9e3f7;
      background: transparent;
      border: 1px solid #51617e;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 13px;
    }

    #gate label {
      display: block;
      font-weight: 650;
      margin: 8px 0 4px;
    }

    #gate input {
      width: 100%;
      height: 45px;
      padding: 8px 12px;
      color: white;
      background: #111729;
      border: 1px solid #44506e;
      border-radius: 12px;
    }

    #gate button:not(#language) {
      width: 100%;
      min-height: 48px;
      font-weight: 650;
      border-radius: 12px;
      margin-top: 8px;
    }

    #gate #google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 0;
      background: white;
      color: #202124;
      border: 1px solid #dadce0;
    }

    #google svg { width: 20px; height: 20px; flex: none; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 4px;
      color: #abb6d1;
      font-size: 14px;
    }

    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #435070;
    }

    #login {
      background: #326dd6;
      color: white;
      border: 0;
    }

    #create, #forgot, #accountActions button {
      background: transparent;
      color: #65d5cd;
      border: 1px solid #369b9e;
    }

    #authFeedback, #message {
      color: #ffdfab;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 10px 0;
    }

    #gate p:empty { display: none; }

    #workspace {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      color: #15372c;
      background: white;
      padding-top: env(safe-area-inset-top);
    }

    #bar, #choices {
      padding: 8px;
      background: #f1f7f4;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid #d4e5dc;
    }

    #bar p { margin: 0; }
    #bar button { font-size: .85rem; }
    #emailDisplay { margin-inline-start: auto; overflow-wrap: anywhere; }

    #workspace button, dialog input, dialog select {
      border: 1px solid #9bb9aa;
      border-radius: 8px;
      padding: 7px 10px;
      background: white;
      color: #14543b;
    }

    iframe { width: 100%; flex: 1; min-height: 0; border: 0; }

    dialog {
      width: min(94%, 460px);
      max-height: 85vh;
      overflow: auto;
      padding: 20px;
      border: 1px solid #b8c9bf;
      border-radius: 16px;
    }

    dialog::backdrop { background: #10231f77; }
    dialog label { display: block; margin: 10px 0 4px; }
    dialog input { width: 100%; }
    dialog form button { margin-top: 8px; }
    dialog h3, dialog h4 { margin: 10px 0; }

    .member {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
    }

    .member bdi, #adminMessage, #status { overflow-wrap: anywhere; }
  </style>

  <script defer src="./vendor/firebase-app-compat.js"></script>
  <script defer src="./vendor/firebase-auth-compat.js"></script>
  <script defer src="./vendor/firebase-firestore-compat.js"></script>
  <script defer src="./firebase-config.js"></script>
  <script defer src="./cloud.js"></script>
</head>

<body>
  <main id="gate">
    <header class="auth-banner">
      <h1 data-ar="متتبع الدخل والمصروفات اليومية">Daily Income &amp; Expense Tracker</h1>
    </header>

    <div class="auth-card">
      <div class="auth-title">
        <h2 data-ar="تسجيل الدخول أو إنشاء حساب">Sign in or create account</h2>
        <button id="language" type="button">العربية</button>
      </div>

      <button id="google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-ar="تسجيل الدخول باستخدام Google">Sign in with Google</span>
      </button>

      <p role="alert" id="authFeedback"></p>
      <p role="status" id="message"></p>

      <form id="authForm">
        <div class="auth-divider">
          <span data-ar="أو باستخدام البريد">or with email</span>
        </div>

        <label for="email" data-ar="البريد الإلكتروني">Email</label>
        <input id="email" type="email" dir="ltr" autocomplete="username" required>

        <label for="password" data-ar="كلمة المرور">Password</label>
        <input id="password" type="password" dir="ltr"
               autocomplete="current-password" required>

        <button id="login" type="submit" data-ar="تسجيل الدخول">Sign in</button>
        <button id="create" type="submit" data-ar="إنشاء حساب">Create account</button>
        <button id="forgot" type="button" data-ar="نسيت كلمة المرور">Forgot password</button>
      </form>

      <div id="accountActions" hidden>
        <button id="verify" data-ar="إرسال رابط تأكيد البريد">Send verification email</button>
        <button id="checkAccess" data-ar="تحقق من الوصول">Check access</button>
        <button id="leave" data-ar="خروج">Sign out</button>
      </div>

      <noscript>Enable JavaScript to use Daily Tracker.</noscript>
    </div>
  </main>

  <section id="workspace" hidden>
    <header id="bar">
      <p id="status" role="status"></p>
      <span id="emailDisplay"></span>
      <span id="branchLabel"></span>
      <button hidden id="share" data-ar="مشاركة وإدارة الفروع">Manage stores</button>
      <button id="retry" data-ar="تحديث">Refresh</button>
      <button id="logout" data-ar="خروج">Sign out</button>
    </header>

    <div id="choices" hidden>
      <p id="conflictText"></p>
      <button id="download" data-ar="تنزيل نسخة الجهاز">Download device copy</button>
      <button id="accept" data-ar="فتح نسخة السحابة">Open cloud copy</button>
      <button id="replace" data-ar="استخدام نسخة الجهاز">Use device copy</button>
    </div>

    <dialog id="adminPanel">
      <h3 data-ar="مشاركة الفرع">Share store</h3>
      <button id="closePanel" data-ar="تم">Done</button>

      <label>
        <span data-ar="الفرع الحالي">Current store</span>
        <select id="branch"></select>
      </label>

      <p><span data-ar="مالك الفرع">Store owner</span> <bdi id="branchOwner"></bdi></p>
      <h4 data-ar="الأعضاء وصلاحية التعديل">Members and access</h4>
      <section id="members"></section>

      <form id="assign">
        <label>
          <span data-ar="إضافة بريد أو نقله إلى هذا الفرع">Add or transfer email to this store</span>
          <input type="email" required id="memberEmail" dir="ltr">
        </label>
        <button data-ar="حفظ وتفعيل">Save and enable</button>
      </form>

      <hr>
      <h3 data-ar="ملاك الفروع المعتمدون">Approved store owners</h3>
      <div id="owners"></div>

      <h4 data-ar="اعتماد مالك فرع جديد">Approve a new store owner</h4>
      <form id="newBranch">
        <label>
          <span data-ar="اسم الفرع">Store name</span>
          <input id="branchName" maxlength="100" required>
        </label>
        <label>
          <span data-ar="بريد المالك">Owner email</span>
          <input id="ownerEmail" type="email" dir="ltr" required>
        </label>
        <button data-ar="إنشاء الفرع واعتماد المالك">Create store and approve owner</button>
      </form>

      <p role="status" id="adminMessage"></p>
    </dialog>

    <iframe id="ledger" title="Daily Tracker"></iframe>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = id => document.getElementById(id);
      const languageKey = "daily-tracker-lang";
      let language = localStorage.getItem(languageKey) === "ar" ? "ar" : "en";

      const choose = (english, arabic) => language === "ar" ? arabic : english;
      const labels = [...document.querySelectorAll("[data-ar]")];

      labels.forEach(node => {
        node.dataset.en = node.textContent.trim();
      });

      // Messages produced by the existing multi-store cloud.js.
      const messages = [
        ["جارٍ تسجيل الدخول…", "Signing in…"],
        ["جارٍ التحقق من صلاحية الدخول…", "Checking access…"],
        ["أكّد بريدك ثم اضغط تحقق من الوصول.", "Verify your email, then select Check access."],
        ["أرسلنا رابط التأكيد إلى بريدك.", "Verification email sent."],
        ["الوصول إلى هذا الفرع غير مفعّل. تواصل مع المدير.", "Store access is disabled. Contact your administrator."],
        ["أضف إعدادات مشروع Firebase الجديد إلى firebase-config.js لتفعيل تسجيل الدخول.", "Add your Firebase web app configuration to firebase-config.js."],
        ["استخدم إعدادات مشروع Firebase الجديد المستقل.", "Use the configuration for your separate Firebase project."],
        ["افتح التطبيق في متصفح حديث.", "Open the app in a current browser."],
        ["أغلق نافذة الدفتر الأخرى ثم اضغط تحقق من الوصول.", "Close the other ledger window, then select Check access."],
        ["يلزم اتصال لتأكيد صلاحيات الفروع.", "Connect to the internet to verify store access."],
        ["يلزم اتصال للتحقق من صلاحية الفرع.", "Connect to the internet to check this store’s access."],
        ["انقطع الاتصال. يُفتح الدفتر بعد التحقق مجددًا من صلاحية الفرع.", "You are offline. Reconnect to verify access."],
        ["تعذّر تجهيز التطبيق للعمل دون اتصال. افتحه عبر HTTPS ثم أعد المحاولة.", "Offline setup failed. Open the app over HTTPS and retry."],
        ["تعذّر بدء التطبيق. ", "App startup failed. "],
        ["تعذّر تسجيل الدخول. ", "Sign-in failed. "]
      ];

      function translateMessage() {
        const node = el("message");
        for (const [ar, en] of messages) {
          const from = choose(ar, en);
          const to = choose(en, ar);
          if (node.textContent.startsWith(from)) {
            node.textContent = to + node.textContent.slice(from.length);
            break;
          }
        }
      }

      let feedback = ["", ""];

      function show(english, arabic) {
        feedback = [english, arabic];
        el("authFeedback").textContent = choose(english, arabic);
      }

      function paint() {
        document.documentElement.lang = language;
        document.documentElement.dir = choose("ltr", "rtl");
        labels.forEach(node => {
          node.textContent = node.dataset[language];
        });
        el("language").textContent = choose("العربية", "English");
        el("authFeedback").textContent = choose(...feedback);
        translateMessage();
      }

      new MutationObserver(translateMessage).observe(el("message"), {
        childList: true
      });

      el("language").disabled = false;
      el("language").onclick = () => {
        language = choose("ar", "en");
        localStorage.setItem(languageKey, language);
        paint();
      };

      window.addEventListener("storage", event => {
        if (event.key === languageKey) {
          language = event.newValue === "ar" ? "ar" : "en";
          paint();
        }
      });

      paint();

      let authClient;
      try {
        authClient = firebase.auth();
      } catch (error) {
        console.error("Firebase startup", error);
        show(
          "Firebase setup failed. Check firebase-config.js and vendor/. " + error.message,
          "تعذّر تشغيل Firebase. تحقق من ملفات الإعداد والمكتبات. " + error.message
        );
        return;
      }

      function report(error) {
        console.error("Firebase Authentication", error);
        const details = [error.code, error.message].filter(Boolean).join(" — ");

        let english = "Authentication failed.";
        let arabic = "تعذّرت المصادقة.";

        if (error.code === "auth/unauthorized-domain") {
          english = "Add " + location.hostname +
            " under Firebase Authentication → Settings → Authorized domains.";
          arabic = "أضف " + location.hostname +
            " إلى Authorized domains في إعدادات Firebase Authentication.";
        } else if (error.code === "auth/popup-blocked") {
          english = "Allow pop-ups for this site and try again, or sign in with email.";
          arabic = "اسمح بالنوافذ المنبثقة لهذا الموقع وأعد المحاولة، أو ادخل بالبريد.";
        } else if (error.code === "auth/popup-closed-by-user") {
          english = "The Google window closed before sign-in finished. Select Sign in with Google to retry.";
          arabic = "أُغلقت نافذة Google قبل اكتمال الدخول. اضغط زر Google للمحاولة مجددًا.";
        }

        show(english + " " + details, arabic + " " + details);
      }

      async function run(action) {
        const buttons = [...el("gate").querySelectorAll("button")]
          .filter(button => button.id !== "language");

        buttons.forEach(button => { button.disabled = true; });
        el("message").textContent = "";
        show("", "");

        try {
          await action();
        } catch (error) {
          report(error);
        } finally {
          buttons.forEach(button => { button.disabled = false; });
        }
      }

      el("google").onclick = () => run(() => {
        show("Opening Google sign-in…", "جارٍ فتح نافذة تسجيل الدخول إلى Google…");
        const provider = new firebase.auth.GoogleAuthProvider();
        return authClient.signInWithPopup(provider).then(() => show("", ""));
      });

      el("authForm").onsubmit = event => {
        event.preventDefault();
        const method = event.submitter?.id === "create"
          ? "createUserWithEmailAndPassword"
          : "signInWithEmailAndPassword";

        run(() => authClient[method](
          el("email").value.trim(),
          el("password").value
        ));
      };

      el("forgot").onclick = () => {
        if (!el("email").reportValidity()) return;

        run(async () => {
          authClient.languageCode = language;
          await authClient.sendPasswordResetEmail(el("email").value.trim());
          show(
            "Check your inbox for a password reset link.",
            "تحقّق من بريدك للحصول على رابط إعادة تعيين كلمة المرور."
          );
        });
      };
    });
  </script>
</body>
</html>
