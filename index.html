<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10B981">
  <meta name="application-name" content="Daily Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Tracker">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

  <title>Daily Income &amp; Expense Tracker</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f7f4;
      color: #14392c;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main, dialog {
      width: min(94%, 410px);
      padding: 24px;
      background: white;
      border: 1px solid #cbded3;
      border-radius: 16px;
    }

    main { margin: 6vh auto; }
    h1 { font-size: 1.45rem; }
    label { display: block; margin-top: 12px; }

    input, button, select {
      font: inherit;
      padding: 8px;
      border: 1px solid #9bb9aa;
      border-radius: 8px;
    }

    input { width: 100%; }

    button {
      cursor: pointer;
      background: white;
      color: #14543b;
    }

    main button, dialog button { margin-top: 8px; }
    form button, #google { width: 100%; }

    #login {
      background: #076747;
      color: white;
    }

    #language { float: inline-end; }

    #google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #google svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    #message, #status, #adminMessage, #authFeedback {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #workspace {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: white;
    }

    #bar, #choices {
      padding: 8px;
      background: #f1f7f4;
    }

    #bar {
      display: grid;
      gap: 4px;
      padding: 7px 10px;
    }
    .bar-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    #bar p { margin: 0; font-size: .78rem; overflow-wrap: anywhere; }
    #status { flex: 1 0 max-content; max-width: 100%; overflow-wrap: normal; }
    @media(max-width:600px){#bar #status{flex-basis:100%}}
    #status[data-saved="true"]::before {
      content: ""; display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: #15954c; margin-inline-end: 5px;
    }
    #profileName { min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-size: .85rem; }
    #bar button { font-size: .76rem; padding: 3px 8px; min-height: 32px; }
    .access-buttons { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; max-width: 100%; }
    .access-buttons:has(> button[hidden]:first-child) { display: none; }
    #bar .bar-row:first-child { flex-wrap: wrap; }
    #bar #share { background: #076747; color: white; border-color: #076747; }
    #activeBranch { max-width: 45%; font: inherit; font-size: .76rem; }

    iframe {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
    }

    dialog {
      max-height: 85vh;
      overflow: auto;
    }

    [hidden] { display: none !important; }
    :root{color-scheme:only light}
    #bar {background:white;border-bottom:1px solid #e8e5df}
    #bar button,#bar #share{background:#fff;color:#28261f;border:1px solid #e8e5df;border-radius:10px;display:inline-flex;align-items:center;gap:6px;padding:8px 11px}
    #bar button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
    #bar #share svg{color:#984534}#authorized svg{color:#356148}#logout svg{color:#76513e}#workspaceLanguage svg{color:#465e85}
    #bar #editName{border-color:transparent;text-align:start}
    #bar[data-role="member"] :is(#logout,#workspaceLanguage) span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    #bar.scrolled{display:none}
    #adminPanel,#nameDialog,#storeNameDialog{width:min(490px,calc(100% - 24px));border-radius:16px;border:1px solid #e8e5df;background:#fff;color:#28261f;padding:20px}
    #adminPanel::backdrop,#nameDialog::backdrop,#storeNameDialog::backdrop{background:#29231975}
    @media(max-width:600px){#bar button,#bar #share{padding:6px 8px;min-height:38px}.access-buttons{gap:4px}}
    body:has(#gate:not([hidden])){background:#f7f3ed;color:#28261f}
    #gate{width:min(calc(100% - 28px),500px);margin:clamp(20px,10vh,110px) auto;padding:clamp(18px,5vw,34px);border:1px solid #e8e0d5;border-radius:20px;background:#fffdf9;box-shadow:0 12px 34px #39291512}
    .login-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#076747}
    #gate h1{font-size:clamp(1.8rem,5vw,2.35rem);margin:12px 0 16px}
    #gate button,#gate input{border-color:#e8e0d5;color:#28261f}
    #gate #language{float:none;margin:0;padding:6px 10px}
    #gate #google{min-height:44px;font-weight:650}
    #gate input{min-height:43px;background:#fff}
    #gate button:focus-visible,#gate input:focus-visible{outline:2px solid #076747;outline-offset:2px}
    .password-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 12px;margin-top:6px}
    .password-row label{margin:0}
    #gate #forgot{width:auto;min-height:40px;margin:0;padding:4px 0;border:0;background:transparent;color:#076747;font-size:.86rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
    #gate :is(#login,#create){min-height:44px;font-weight:650}
    #gate #login{margin-top:16px;background:#076747;border-color:#076747;color:white}
    #gate #login:hover:enabled{background:#05573d}
    #gate #create{margin-top:10px;background:transparent;border-color:#8ab4a4;color:#076747}
    #gate #create:hover:enabled{background:#edf7f1}
    #gate button:disabled{opacity:.6;cursor:wait}
    #gate :is(#message,#authFeedback):empty{display:none}
    #adminPanel {
      width: min(540px, calc(100% - 24px));
      max-height: calc(100dvh - 24px);
      border-color: #dae7e0;
      border-radius: 20px;
      padding: clamp(16px, 4vw, 26px);
      color: #173b2d;
      box-shadow: 0 18px 44px #2d211d26;
    }
    #adminPanel h2 {
      margin: 0 0 16px;
      font-size: 1.4rem;
      line-height: 1.3;
    }
    #adminPanel :is(input, button) {
      min-height: 44px;
      margin: 0;
      padding: 8px 12px;
      border: 1px solid #cbded3;
      border-radius: 9px;
      background: #fff;
      color: #173b2d;
    }
    #adminPanel :is(input, button):focus-visible {
      outline: 2px solid #076747;
      outline-offset: 2px;
    }
    #adminPanel button:hover:enabled { background: #f1f7f4; }
    #adminPanel button:disabled { opacity: .6; cursor: wait; }
    #inviteOwner { display: grid; gap: 12px; }
    #inviteOwner label { display: grid; gap: 5px; margin: 0; font-weight: 600; }
    #inviteOwner input { font-weight: 400; }
    #adminPanel .access-primary {
      border-color: #076747;
      background: #076747;
      color: #fff;
      font-weight: 650;
    }
    #adminPanel .access-primary:hover:enabled { background: #05573d; }
    #inviteHelp { margin: 0; color: #476358; font-size: .9rem; }
    #invitationListTitle { margin: 0; font-size: 1rem; }
    #invitationAccountHelp { margin: 4px 0 10px; color: #476358; font-size: .875rem; }
    #invitations {
      display: grid;
      gap: 8px;
      max-height: min(50dvh, 440px);
      margin: 0;
      padding: 3px;
      overflow-y: auto;
      list-style: none;
    }
    #invitations > li {
      padding: 10px 12px;
      border: 1px solid #e1ebe5;
      border-radius: 12px;
      background: #f6faf8;
    }
    .invitation-empty { color: #476358; text-align: center; }
    .invitation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }
    .invitation-details { display: grid; justify-items: start; gap: 4px; min-width: 0; }
    .invitation-details bdi { max-width: 100%; overflow-wrap: anywhere; font-weight: 650; }
    .invitation-account { color: #476358; font-size: .8rem; }
    .invitation-status {
      padding: 2px 8px;
      border-radius: 999px;
      background: #fff0d2;
      color: #6f4a00;
      font-size: .8rem;
      font-weight: 600;
    }
    .invitation-row[data-state="accepted"] .invitation-status { background: #dcefe4; color: #245d43; }
    .invitation-row[data-state="revoked"] .invitation-status { background: #e9eeeb; color: #4b5d55; }
    .invitation-row[data-state="legacy"] .invitation-status { background: #e9eef4; color: #36516b; }
    #adminPanel button[data-revoke] { border-color: #ead0cc; color: #8a3328; font-size: .875rem; }
    #adminPanel button[data-revoke]:hover:enabled { background: #fff2f0; }
    #adminPanel .access-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e1ebe5;
    }
    #adminMessage { margin: 12px 0 0; color: #3f584e; font-size: .9rem; }
    #adminMessage:empty { display: none; }
    @media (max-width: 360px) {
      .invitation-row { grid-template-columns: 1fr; }
      .invitation-row button { justify-self: end; }
    }
  </style>

  <script defer src="./vendor/firebase-app-compat.js"></script>
  <script defer src="./vendor/firebase-auth-compat.js"></script>
  <script defer src="./vendor/firebase-firestore-compat.js"></script>
  <script defer src="./firebase-config.js"></script>
  <script defer src="./cloud.js"></script>
</head>

<body>
  <main id="gate">
    <div class="login-heading"><strong>Daily Tracker</strong><button id="language" type="button">العربية</button></div>
    <h1 data-ar="تسجيل الدخول">Sign in</h1>

    <button id="google" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span data-ar="تسجيل الدخول باستخدام Google">Sign in with Google</span>
    </button>

    <form id="authForm">
      <label for="email" data-ar="البريد الإلكتروني">Email</label>
      <input id="email" type="email" dir="ltr" autocomplete="username" required>

      <div class="password-row">
        <label for="password" data-ar="كلمة المرور">Password</label>
        <button id="forgot" type="button" data-ar="نسيت كلمة المرور">Forgot password</button>
      </div>
      <input id="password" type="password" dir="ltr"
             autocomplete="current-password" required>

      <button id="login" type="submit" data-ar="تسجيل الدخول">Sign in</button>
      <button id="create" type="submit" data-ar="إنشاء حساب">Create account</button>
    </form>

    <div id="accountActions" hidden>
      <button id="verify" data-ar="إرسال رابط تأكيد البريد">Send verification email</button>
      <button id="checkAccess" data-ar="تحقق من الوصول">Check access</button>
      <button id="leave" data-ar="خروج">Sign out</button>
    </div>

    <p role="status" id="message"></p>
    <p role="alert" id="authFeedback"></p>
    <noscript>Enable JavaScript to use Daily Tracker.</noscript>
  </main>

  <section id="workspace" hidden>
    <header id="bar">
      <div class="bar-row">
        <p id="status" role="status"></p>
        <button hidden id="retry" data-ar="تحديث">Refresh</button>
        <div class="access-buttons">
          <button hidden id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h.01m10-6h.01m0 12h.01M9 11l6-4m-6 6 6 4M5 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0Zm10-6a2 2 0 1 0 4 0 2 2 0 0 0-4 0Zm0 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0Z"/></svg><span data-ar="منح الوصول">Grant access</span></button>
          <button hidden id="authorized"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-4m-6-6a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg><span data-ar="المصرّح لهم">Authorized people</span></button>
        </div>
        <button  id="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 17 5-5-5-5m5 5H3m13-8h5v16h-5"/></svg><span data-ar="تسجيل الخروج">Sign out</span></button>
        <button type="button" id="workspaceLanguage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18m-9 9c5-5 5-13 0-18m0 18c-5-5-5-13 0-18m9 9a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg><span>العربية</span></button>
      </div>
      <div class="bar-row">
        <button id="editName" type="button"><bdi id="profileName"></bdi></button>
        <span id="emailDisplay" hidden></span>
        <select id="activeBranch" aria-label="Store / الفرع" hidden></select>
        <button id="useInvite" data-ar="إنشاء فرعي" hidden>Create my store</button>
      </div>
    </header>

    <div id="choices" hidden>
      <p id="conflictText"></p>
      <button id="download" data-ar="تنزيل نسخة الجهاز">Download device copy</button>
      <button id="accept" data-ar="فتح نسخة السحابة">Open cloud copy</button>
      <button id="replace" data-ar="استخدام نسخة الجهاز">Use device copy</button>
    </div>

    <dialog id="adminPanel" aria-labelledby="grantTitle">
      <h2 id="grantTitle" data-ar="منح الوصول">Grant access</h2>
      <h2 id="authorizedTitle" data-ar="المصرّح لهم" hidden>Authorized people</h2>

      <section id="adminOnly" hidden>
        <form id="inviteOwner">
          <label><span data-ar="البريد الإلكتروني للمدعو">Invitee’s email address</span>
            <input id="ownerEmail" type="email" dir="ltr" aria-describedby="inviteHelp" autocomplete="off" maxlength="254" required>
          </label>
          <p id="inviteHelp" data-ar="بعد الموافقة، شارك رابط التطبيق مع المدعو ليدخل ببريده ويدير محله.">After approval, share the app link so the invitee can sign in and manage their store.</p>
          <button class="access-primary" data-ar="تأكيد الدعوة">Approve invitation</button>
        </form>
        <section id="invitationList" aria-labelledby="invitationListTitle" hidden>
          <h3 id="invitationListTitle" data-ar="عناوين البريد الإلكتروني">Email addresses</h3>
          <p id="invitationAccountHelp" data-ar="يتأكد الحساب بعد تسجيل الدخول إلى التطبيق ببريد إلكتروني موثّق.">An account is confirmed after signing in to the app with a verified email address.</p>
          <ul id="invitations" role="list" aria-describedby="invitationAccountHelp"></ul>
        </section>
      </section>

      <p role="status" id="adminMessage"></p>
      <div class="access-footer">
        <button type="button" id="copyAccessLink" data-ar="نسخ رابط التطبيق">Copy app link</button>
        <button type="button" id="closePanel" data-ar="إغلاق">Close</button>
      </div>
    </dialog>

    <iframe id="ledger" title="Daily Tracker"></iframe>
  </section>

  <dialog id="storeNameDialog" aria-labelledby="storeNameTitle">
    <form id="storeNameForm">
      <h3 id="storeNameTitle" data-ar="اسم المحل">Store name</h3>
      <label for="newStoreName" data-ar="اسم المحل الجديد">New store name</label>
      <input id="newStoreName" maxlength="100" required>
      <button type="submit" data-ar="حفظ اسم المحل">Save store name</button>
      <button type="button" id="cancelStoreName" data-ar="إلغاء">Cancel</button>
      <p id="storeNameFeedback" role="status"></p>
    </form>
  </dialog>
  <dialog id="nameDialog">
    <form id="nameForm">
      <h3 data-ar="اسمك في التطبيق">Your name</h3>
      <label><span data-ar="الاسم">Name</span>
        <input id="userName" maxlength="60" autocomplete="name" required>
      </label>
      <button data-ar="حفظ الاسم">Save name</button>
      <p id="nameFeedback" role="status"></p>
    </form>
  </dialog>

  <dialog id="createDialog">
    <form id="createInvitedStore">
      <label><span data-ar="اسم فرعك">Your store name</span>
        <input id="invitedStoreName" maxlength="100" required>
      </label>
      <button data-ar="إنشاء الفرع">Create store</button>
      <button type="button" id="cancelCreate" data-ar="إلغاء">Cancel</button>
      <p id="createFeedback" role="status"></p>
    </form>
  </dialog>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = id => document.getElementById(id);
      const languageKey = "daily-tracker-lang";
      let language = localStorage.getItem(languageKey) === "ar" ? "ar" : "en";

      const choose = (english, arabic) => language === "ar" ? arabic : english;
      const labels = [...document.querySelectorAll("[data-ar]")];

      labels.forEach(node => {
        node.dataset.en = node.textContent.trim();
      });

      const messages = [
        ["جارٍ تسجيل الدخول…", "Signing in…"],
        ["جارٍ التحقق من صلاحية الدخول…", "Checking access…"],
        ["أكّد بريدك ثم اضغط تحقق من الوصول.", "Verify your email, then select Check access."],
        ["أرسلنا رابط التأكيد إلى بريدك.", "Verification email sent."],
        ["الوصول إلى هذا الفرع غير مفعّل. تواصل مع المدير.", "Store access is disabled. Contact your administrator."],
        ["أضف إعدادات مشروع Firebase الجديد إلى firebase-config.js لتفعيل تسجيل الدخول.", "Add your Firebase web app configuration to firebase-config.js."],
        ["استخدم إعدادات مشروع Firebase الجديد المستقل.", "Use the configuration for your separate Firebase project."],
        ["افتح التطبيق في متصفح حديث.", "Open the app in a current browser."],
        ["أغلق نافذة الدفتر الأخرى ثم اضغط تحقق من الوصول.", "Close the other ledger window, then select Check access."],
        ["يلزم اتصال لتأكيد صلاحيات الفروع.", "Connect to the internet to verify store access."],
        ["يلزم اتصال للتحقق من صلاحية الفرع.", "Connect to the internet to check this store’s access."],
        ["انقطع الاتصال. يُفتح الدفتر بعد التحقق مجددًا من صلاحية الفرع.", "You are offline. Reconnect to verify access."],
        ["تعذّر تجهيز التطبيق للعمل دون اتصال. افتحه عبر HTTPS ثم أعد المحاولة.", "Offline setup failed. Open the app over HTTPS and retry."],
        ["تعذّر بدء التطبيق. ", "App startup failed. "],
        ["تعذّر تسجيل الدخول. ", "Sign-in failed. "]
      ];

      function translateMessage() {
        const node = el("message");

        for (const [ar, en] of messages) {
          const from = choose(ar, en);
          const to = choose(en, ar);

          if (node.textContent.startsWith(from)) {
            node.textContent = to + node.textContent.slice(from.length);
            break;
          }
        }
      }

      let feedback = ["", ""];

      function show(english, arabic) {
        feedback = [english, arabic];
        el("authFeedback").textContent = choose(english, arabic);
      }

      function paint() {
        document.documentElement.lang = language;
        document.documentElement.dir = choose("ltr", "rtl");

        labels.forEach(node => {
          node.textContent = node.dataset[language];
        });

        el("language").textContent = choose("العربية", "English");
        el("workspaceLanguage").querySelector("span").textContent = el("language").textContent;
        el("authFeedback").textContent = choose(...feedback);
        translateMessage();
        document.dispatchEvent(new Event("tracker-language"));
      }

      new MutationObserver(translateMessage).observe(el("message"), {
        childList: true
      });

      el("language").disabled = false;
      el("language").onclick = () => {
        language = choose("ar", "en");
        localStorage.setItem(languageKey, language);
        paint();
      };

      el("workspaceLanguage").onclick = () => el("language").click();
      window.addEventListener("storage", event => {
        if (event.key === languageKey) {
          language = event.newValue === "ar" ? "ar" : "en";
          paint();
        }
      });

      paint();

      let authClient;

      try {
        authClient = firebase.auth();
      } catch (error) {
        console.error("Firebase startup", error);
        show(
          "Firebase setup failed. Check firebase-config.js and vendor/. " + error.message,
          "تعذّر تشغيل Firebase. تحقق من ملفات الإعداد والمكتبات. " + error.message
        );
        return;
      }

      function report(error) {
        console.error("Firebase Authentication", error);

        const details = [error.code, error.message].filter(Boolean).join(" — ");
        let english = "Authentication failed.";
        let arabic = "تعذّرت المصادقة.";

        if (error.code === "auth/unauthorized-domain") {
          english = "Add " + location.hostname +
            " under Firebase Authentication → Settings → Authorized domains.";
          arabic = "أضف " + location.hostname +
            " إلى Authorized domains في إعدادات Firebase Authentication.";
        } else if (error.code === "auth/popup-blocked") {
          english = "Allow pop-ups for this site and try again, or sign in with email.";
          arabic = "اسمح بالنوافذ المنبثقة لهذا الموقع وأعد المحاولة، أو ادخل بالبريد.";
        }

        show(english + " " + details, arabic + " " + details);
      }

      async function run(action) {
        const buttons = [...el("gate").querySelectorAll("button")]
          .filter(button => button.id !== "language");

        buttons.forEach(button => { button.disabled = true; });
        el("message").textContent = "";
        show("", "");

        try {
          await action();
        } catch (error) {
          report(error);
        } finally {
          buttons.forEach(button => { button.disabled = false; });
        }
      }

      el("google").onclick = () => run(() =>
        authClient.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      );

      el("authForm").onsubmit = event => {
        event.preventDefault();

        const method = event.submitter?.id === "create"
          ? "createUserWithEmailAndPassword"
          : "signInWithEmailAndPassword";

        run(() => authClient[method](
          el("email").value.trim(),
          el("password").value
        ));
      };

      el("forgot").onclick = () => {
        if (!el("email").reportValidity()) return;

        run(async () => {
          authClient.languageCode = language;
          await authClient.sendPasswordResetEmail(el("email").value.trim());

          show(
            "Check your inbox for a password reset link.",
            "تحقّق من بريدك للحصول على رابط إعادة تعيين كلمة المرور."
          );
        });
      };
    });
  </script>
</body>
</html>
